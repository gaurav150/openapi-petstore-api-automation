openapi: 3.1.0

info:
  title: Swagger PetStore Demo
  description: A sample API for managing pets, orders, and users.
  version: 1.0.0
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    email: apiteam@swagger.io
servers:
  - url: https://petstore.swagger.io/v2

tags:
  - name: pet
    description: Everything about your Pets
  - name: store
    description: Access to PetStore orders
  - name: user
    description: Operations about user

paths:

  # ============================================================
  # PET
  # ============================================================

  /pet/{petId}/uploadImage:

    post:
      tags:
        - pet
      summary: uploads an image
      description: ""
      operationId: uploadFile

      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                additionalMetadata:
                  type: string
                  description: Additional data to pass to server
                file:
                  type: string
                  format: binary
                  description: file to upload

      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64

      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

      security:
        - petstore_auth:
            - write:pets
            - read:pets

  /pet:

    post:
      tags:
        - pet
      summary: Add a new pet to the store
      description: Add a new pet to the store.
      operationId: addPet

      security:
        - petstore_auth:
            - write:pets
      requestBody:
        description: Pet object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
          application/xml:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
            application/xml:
              schema:
                $ref: "#/components/schemas/Pet"
        "405":
          description: Invalid input

    put:
      tags:
        - pet
      summary: Update an existing pet
      description: Update an existing pet by Id.
      operationId: updatePet

      security:
        - petstore_auth:
            - write:pets
      requestBody:
        description: Pet object that needs to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
          application/xml:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
            application/xml:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found
        "405":
          description: Validation exception

  /pet/findByStatus:

    get:
      tags:
        - pet
      summary: Finds Pets by status
      description: Multiple status values can be provided with comma-separated strings.
      operationId: findPetsByStatus

      security:
        - petstore_auth:
            - read:pets

      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - available
                - pending
                - sold
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid status value

  /pet/findByTags:

    get:
      tags:
        - pet
      summary: Finds Pets by tags
      description: Multiple tags can be provided with comma-separated strings.
      operationId: findPetsByTags
      deprecated: true

      security:
        - petstore_auth:
            - read:pets
      parameters:
        - name: tags
          in: query
          description: Tags to filter by
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid tag value

  /pet/{petId}:

    get:
      tags:
        - pet
      summary: Find pet by ID
      description: Returns a single pet.
      operationId: getPetById

      security:
        - petstore_auth:
            - read:pets
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
            application/xml:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found

    post:
      tags:
        - pet
      summary: Updates a pet in the store with form data
      description: Updates a pet's name and status using form parameters.
      operationId: updatePetWithForm

      security:
        - petstore_auth:
            - write:pets
      parameters:
        - name: petId
          in: path
          description: ID of pet that needs to be updated
          required: true
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          description: Updated name of the pet
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Updated status of the pet
          required: false
          schema:
            type: string
      responses:
        "405":
          description: Invalid input

    delete:
      tags:
        - pet
      summary: Deletes a pet
      description: Delete a pet by ID.
      operationId: deletePet

      security:
        - api_key: []
      parameters:
        - name: api_key
          in: header
          description: API key
          required: false
          schema:
            type: string
        - name: petId
          in: path
          description: Pet ID to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "400":
          description: Invalid pet value


  # ============================================================
  # STORE
  # ============================================================

  /store/inventory:

    get:
      tags:
        - store
      summary: Returns pet inventories by status
      description: Returns a map of status codes to quantities.
      operationId: getInventory
      security:
        - api_key: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32


  /store/order:

    post:
      tags:
        - store
      summary: Place an order for a pet
      description: Place a new order in the store.
      operationId: placeOrder
      security:
        - petstore_auth:
            - write:pets
      requestBody:
        description: Order object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
          application/xml:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
            application/xml:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid Order


  /store/order/{orderId}:

    get:
      tags:
        - store
      summary: Find purchase order by ID
      description: For valid response try integer IDs with value <= 5 or > 10. Other values will generate exceptions.
      operationId: getOrderById
      security:
        - api_key: []
      parameters:
        - name: orderId
          in: path
          description: ID of order that needs to be fetched
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 10
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
            application/xml:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid ID supplied
        "404":
          description: Order not found

    delete:
      tags:
        - store
      summary: Delete purchase order by ID
      description: For valid response try integer IDs with value <= 5 or > 10. Other values will generate exceptions.
      operationId: deleteOrder
      security:
        - api_key: []
      parameters:
        - name: orderId
          in: path
          description: ID of the order that needs to be deleted
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 10
      responses:
        "400":
          description: Invalid ID supplied
        "404":
          description: Order not found


  # ============================================================
  # USER
  # ============================================================

  /user:

    post:
      tags:
        - user
      summary: Create user
      description: This can only be done by the logged-in user.
      operationId: createUser
      security:
        - petstore_auth:
            - write:pets
      requestBody:
        description: Created user object
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
          application/xml:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        default:
          description: Successful operation


  /user/createWithList:

    post:
      tags:
        - user
      summary: Creates list of users with given input array
      description: Creates multiple users from a supplied array.
      operationId: createUsersWithListInput
      security:
        - petstore_auth:
            - write:pets
      requestBody:
        description: List of user objects
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
          application/xml:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
      responses:
        "200":
          description: Successful operation


  /user/login:

    get:
      tags:
        - user
      summary: Logs user into the system
      description: Login using username and password.
      operationId: loginUser
      security: []
      parameters:
        - name: username
          in: query
          description: The username for login
          required: true
          schema:
            type: string
        - name: password
          in: query
          description: The password for login
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
        "400":
          description: Invalid username/password


  /user/logout:

    get:
      tags:
        - user
      summary: Logs out current logged-in user
      description: Logs out the current logged-in user.
      operationId: logoutUser
      security:
        - petstore_auth:
            - read:pets
            - write:pets
      responses:
        default:
          description: Successful operation


  /user/{username}:

    get:
      tags:
        - user
      summary: Get user by user name
      description: Returns a single user.
      operationId: getUserByName
      security:
        - petstore_auth:
            - read:pets

      parameters:
        - name: username
          in: path
          description: The name that needs to be fetched
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username supplied
        "404":
          description: User not found

    put:
      tags:
        - user
      summary: Updated user
      description: This can only be done by the logged-in user.
      operationId: updateUser
      security:
        - petstore_auth:
            - write:pets
      parameters:
        - name: username
          in: path
          description: Name that needs to be updated
          required: true
          schema:
            type: string
      requestBody:
        description: Updated user object
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
          application/xml:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        default:
          description: Successful operation

    delete:
      tags:
        - user
      summary: Delete user
      description: This can only be done by the logged-in user.
      operationId: deleteUser
      security:
        - petstore_auth:
            - write:pets
      parameters:
        - name: username
          in: path
          description: The user that needs to be deleted
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Invalid username supplied
        "404":
          description: User not found


# ==============================================================
# COMPONENTS
# ==============================================================

components:

  # ============================================================
  # SECURITY SCHEMES
  # ============================================================

  securitySchemes:

    api_key:
      type: apiKey
      name: api_key
      in: header

    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore.swagger.io/oauth/authorize
          scopes:
            read:pets: read your pets
            write:pets: modify pets in your account

  schemas:

    # ------------------------------------------------------------
    #   API Response
    # ------------------------------------------------------------
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string

    # ------------------------------------------------------------
    # PET
    # ------------------------------------------------------------

    Pet:
      type: object
      required:
        - name
        - photoUrls
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 10

        category:
          $ref: "#/components/schemas/Category"

        name:
          type: string
          examples:
            - doggie

        photoUrls:
          type: array
          items:
            type: string
          examples:
            - https://example.com/dog.jpg

        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

        status:
          type: string
          description: Pet status in the store
          enum:
            - available
            - pending
            - sold
          examples:
            - available


    # ------------------------------------------------------------
    # CATEGORY
    # ------------------------------------------------------------

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1

        name:
          type: string
          examples:
            - Dogs


    # ------------------------------------------------------------
    # TAG
    # ------------------------------------------------------------

    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1

        name:
          type: string
          examples:
            - dog


    # ------------------------------------------------------------
    # ORDER
    # ------------------------------------------------------------

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 10

        petId:
          type: integer
          format: int64
          examples:
            - 198772

        quantity:
          type: integer
          format: int32
          examples:
            - 7

        shipDate:
          type: string
          format: date-time
          examples:
            - "2026-09-12T10:00:00Z"

        status:
          type: string
          description: Order Status
          enum:
            - placed
            - approved
            - delivered
          examples:
            - placed

        complete:
          type: boolean
          examples:
            - false


    # ------------------------------------------------------------
    # USER
    # ------------------------------------------------------------

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 10

        username:
          type: string
          examples:
            - theUser

        firstName:
          type: string
          examples:
            - John

        lastName:
          type: string
          examples:
            - James

        email:
          type: string
          examples:
            - john@email.com

        password:
          type: string
          examples:
            - "12345"

        phone:
          type: string
          examples:
            - "12345"

        userStatus:
          type: integer
          format: int32
          description: User Status
          examples:
            - 1